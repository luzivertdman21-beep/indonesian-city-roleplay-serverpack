endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

set steam_webApiKey ""
set sv_licenseKey "your_license_key_here"
set sv_hostname "Indonesian City Roleplay"
set rcon_password "change_this_password"
set sv_maxclients 48
set mysql_connection_string "server=127.0.0.1;database=icrp;user=root;password=password;charset=utf8mb4"

# Core dependencies
ensure oxmysql
ensure es_extended
ensure esx_identity
ensure esx_status
ensure esx_phone
ensure esx_menu_default
ensure esx_society
ensure esx_vehicleshop
ensure esx_policejob
ensure esx_ambulancejob
ensure esx_mechanicjob

# Core modular framework
ensure esx_core
ensure job_manager
ensure inventory
ensure police
ensure ems
ensure mechanic
ensure admin
ensure hud
ensure vehicle_manager
ensure business
ensure housing
ensure phone
ensure logger

# Resources optional / custom assets
ensure [maps]
ensure [mlo]
ensure [eup]
ensure [vehicles]

# Basic server settings
set onesync on
set onesync_population 0
set sv_enforceGameBuild 2372
set sv_scriptHookAllowed 0
set gametype "Roleplay"
set map "Los Santos"

# Locale and gameplay default
sets locale "id_ID"
sets tags "roleplay,indonesia,esx,city"

# Voice / Discord / admin scaffolds
add_ace group.admin command allow
add_ace resource.esx_core command.add_ace allow
add_ace resource.inventory command.add_ace allow
add_ace resource.admin command.add_ace allow

# Logging tail
sv_scriptHookAllowed 0

# Server configuration notes
# - Pastikan resource dependency telah di-install sesuai dokumentasi.
# - Untuk MLO/custom asset, tambahkan folder resource di bawah resources/.
# - Gunakan txAdmin untuk menjalankan server.
