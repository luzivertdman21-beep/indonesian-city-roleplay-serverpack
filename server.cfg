# txAdmin/server.cfg sample. Put real secrets in txAdmin or a private server.cfg; never commit them.
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_licenseKey "CHANGE_ME_IN_TXADMIN"
sv_hostname "Indonesian City Roleplay | Staging"
rcon_password "CHANGE_ME_AND_KEEP_PRIVATE"
sv_maxclients 48

# Provide your own database credentials through txAdmin/server.cfg.
set mysql_connection_string "mysql://icrp_user:CHANGE_ME@127.0.0.1/icrp?charset=utf8mb4"

set onesync on
set sv_scriptHookAllowed 0
set gametype "Roleplay"
set mapname "Los Santos"
sets locale "id_ID"
sets tags "roleplay,indonesia,esx,city"

